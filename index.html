<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>楓之谷 M - BOSS 血量與貢獻計算機</title>
    <style>
        :root {
            --bg-color: #212529;
            --card-bg: #343a40;
            --primary: #f39c12; /* 橘金色 */
            --text-main: #f8f9fa;
            --text-sub: #adb5bd;
            --highlight: #e74c3c;
            --success: #2ecc71;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            max-width: 450px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #495057;
            padding-bottom: 15px;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--primary);
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-top: 5px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        select, input[type="range"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #495057;
            background-color: #2b3035;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
        }

        select:focus {
            outline: 2px solid var(--primary);
            border-color: transparent;
        }

        /* Range Slider Styling */
        .range-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        #playerCountDisplay {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary);
            min-width: 30px;
            text-align: center;
        }

        .scaling-tag {
            font-size: 0.8rem;
            background: #495057;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: auto;
        }

        /* Result Cards */
        .result-section {
            display: grid;
            gap: 15px;
            margin-top: 25px;
        }

        .card {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 12px;
            border-left: 5px solid transparent;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        .card.hp { border-left-color: var(--highlight); }
        .card.goal { border-left-color: var(--success); }

        .card-title {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 5px;
        }

        .card-value {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        
        .unit {
            font-size: 1rem;
            color: var(--text-sub);
            font-weight: normal;
        }

        footer {
            margin-top: 25px;
            text-align: center;
            font-size: 0.75rem;
            color: #6c757d;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>BOSS 貢獻度計算機</h1>
        <div class="subtitle">自動計算多人血量加成與 2% 門檻</div>
    </header>

    <div class="control-group">
        <label for="bossSelect">選擇 BOSS</label>
        <select id="bossSelect">
            </select>
    </div>

    <div class="control-group">
        <label>
            挑戰人數
            <span id="scaleDisplay" class="scaling-tag">血量倍率: 100%</span>
        </label>
        <div class="range-container">
            <input type="range" id="playerRange" min="1" max="10" value="10" step="1">
            <span id="playerCountDisplay">10</span>
        </div>
    </div>

    <div class="result-section">
        <div class="card hp">
            <div class="card-title">當前總血量 (HP)</div>
            <div class="card-value">
                <span id="totalHp">0</span> <span class="unit">B</span>
            </div>
        </div>

        <div class="card goal">
            <div class="card-title">最低通關門檻 (2%)</div>
            <div class="card-value" style="color: var(--success)">
                <span id="threshold">0</span> <span class="unit">B</span>
            </div>
        </div>
    </div>

    <footer>
        資料來源：玩家提供數據庫<br>
        數值僅供參考，實際以遊戲內為準
    </footer>
</div>

<script>
    // 1. BOSS 資料庫 (Base HP 為 10 人滿團時的血量)
    const bossData = [
        { name: "混 斑斑", baseHp: 92.00 },
        { name: "混 小丑", baseHp: 93.50 },
        { name: "混 皇后", baseHp: 153.00 },
        { name: "混 貝倫", baseHp: 144.50 },
        { name: "混 凡雷恩", baseHp: 33.60 },
        { name: "混 希拉", baseHp: 72.50 },
        { name: "困 梅格", baseHp: 365.00 },
        { name: "阿卡伊農", baseHp: 946.00 },
        { name: "史烏", baseHp: 3005.00 },
        { name: "普 戴米安", baseHp: 4563.00 },
        { name: "困 戴米安", baseHp: 4563.00 }, // 依據資料，普/困戴米安數值相同
        { name: "困 露希妲", baseHp: 5045.00 },
        { name: "戴斯克", baseHp: 11000.00 },
        { name: "普 雅坎", baseHp: 2620.00 },
        { name: "困 雅坎", baseHp: 19460.00 },
        { name: "威爾", baseHp: 25500.00 }
    ];

    // 2. 人數對應的血量百分比係數
    const scaleMap = {
        1: 0.25,
        2: 0.25,
        3: 0.35,
        4: 0.45,
        5: 0.55,
        6: 0.64,
        7: 0.73,
        8: 0.82,
        9: 0.90,
        10: 1.00
    };

    // DOM 元素
    const bossSelect = document.getElementById('bossSelect');
    const playerRange = document.getElementById('playerRange');
    const playerCountDisplay = document.getElementById('playerCountDisplay');
    const scaleDisplay = document.getElementById('scaleDisplay');
    const totalHpEl = document.getElementById('totalHp');
    const thresholdEl = document.getElementById('threshold');

    // 初始化
    function init() {
        // 填入選單
        bossData.forEach((boss, index) => {
            const option = document.createElement('option');
            option.value = index; // 用索引來找資料
            option.textContent = boss.name;
            bossSelect.appendChild(option);
        });

        // 監聽事件
        bossSelect.addEventListener('change', calculate);
        playerRange.addEventListener('input', (e) => {
            playerCountDisplay.textContent = e.target.value;
            calculate();
        });

        // 預設選擇第一個並計算
        calculate();
    }

    // 計算邏輯
    function calculate() {
        const bossIndex = bossSelect.value;
        const players = parseInt(playerRange.value);
        const boss = bossData[bossIndex];

        // 取得該人數的倍率
        const scale = scaleMap[players];

        // 計算當前血量 (Base HP * Scale)
        const currentHp = boss.baseHp * scale;
        
        // 計算 2% 門檻
        const goal = currentHp * 0.02;

        // 更新 UI
        scaleDisplay.textContent = `血量倍率: ${Math.round(scale * 100)}%`;
        
        // 顯示數字，保留兩位小數 (如果數值很大，也可以考慮用 toLocaleString)
        totalHpEl.textContent = currentHp.toFixed(2);
        thresholdEl.textContent = goal.toFixed(2);
    }

    init();
</script>

</body>
</html>
